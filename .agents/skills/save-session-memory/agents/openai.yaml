interface:
  display_name: "Save Session Memory"
  short_description: "Record work in separate dated session files"
  default_prompt: "Use $save-session-memory. Write YYYY-MM-DD-project.md using --project and the actual work --date (default today). Append same-day events; different dates require separate files. Record the work, requests, actions, discoveries, decisions, attempts, reviews, verification, blockers and outcomes. Preserve history and publish authorized continuity updates."
