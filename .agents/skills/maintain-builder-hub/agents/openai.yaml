interface:
  display_name: "Maintain Builder Hub"
  short_description: "Check or refresh Builder artifact indexes"
  default_prompt: "Use $maintain-builder-hub. Choose read-only check by default or explicit refresh followed by validation. Report failures. Maintenance creates no memory or commits; the calling phase owns finalization and publication. Do not create empty optional specs/decisions folders; index them once records exist."
policy:
  allow_implicit_invocation: true
