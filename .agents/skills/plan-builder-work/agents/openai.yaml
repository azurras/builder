interface:
  display_name: "Plan Builder Work"
  short_description: "Create, review, or validate implementation plans"
  default_prompt: "Use $plan-builder-work. Create a self-contained implementation plan or perform requested read-only review/validation. Put requirements and design in the plan and progress/decisions in project memory. Apply $write-jane-street-style-code and task-specific Before-Edit Briefs to code-changing plans; publish the plan before execution."
policy:
  allow_implicit_invocation: true
