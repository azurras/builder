interface:
  display_name: "Record Runtime Verification"
  short_description: "Save or validate local application evidence"
  default_prompt: "Use $record-runtime-verification. Choose report or read-only validate mode. Require real local application interaction, exact sanitized inputs/outputs, and pass/fail evidence. Unit-test-only output belongs in native validation. Publish a saved runtime report at its phase checkpoint."
policy:
  allow_implicit_invocation: true
